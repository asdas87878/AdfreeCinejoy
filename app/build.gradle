plugins { id 'com.android.application' }

def cfg = new Properties()
def cfgFile = rootProject.file('config.properties')
if (cfgFile.exists()) cfgFile.withInputStream { cfg.load(it) }
def startUrl = (cfg.getProperty('start_url') ?: '').trim().replace('"', '')
def appName = (cfg.getProperty('app_name') ?: 'Ad-free Viewer').trim()
def geckoVersion = project.findProperty('geckoVersion') ?: '+'
def runNumber = Integer.parseInt(System.getenv('GITHUB_RUN_NUMBER') ?: '1')

android {
    namespace 'com.adfree.viewer'
    compileSdk 36

    defaultConfig {
        applicationId 'com.adfree.viewer'
        minSdk 26
        targetSdk 35
        versionCode runNumber
        versionName "1.0.${runNumber}"
        buildConfigField 'String', 'START_URL', "\"${startUrl}\""
        resValue 'string', 'app_name', appName
    }

    signingConfigs {
        release {
            storeFile rootProject.file('keystore/app.jks')
            storePassword 'adfreeviewer'
            keyAlias 'app'
            keyPassword 'adfreeviewer'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    // One APK per CPU type keeps the download small.
    splits {
        abi {
            enable true
            reset()
            include 'arm64-v8a', 'armeabi-v7a'
            universalApk false
        }
    }

    // Keep uBlock's "_locales" folder: by default Android drops asset folders starting with "_".
    androidResources {
        ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:!CVS:!thumbs.db:!picasa.ini:!*~'
    }

    buildFeatures { buildConfig true }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "org.mozilla.geckoview:geckoview:${geckoVersion}"
}
