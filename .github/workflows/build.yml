name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Find latest GeckoView (Firefox engine)
        run: |
          V=$(curl -fsSL https://maven.mozilla.org/maven2/org/mozilla/geckoview/geckoview/maven-metadata.xml \
              | sed -n 's:.*<release>\(.*\)</release>.*:\1:p' | head -1)
          echo "GeckoView version: $V"
          echo "GECKO_VERSION=$V" >> "$GITHUB_ENV"

      - name: Download latest uBlock Origin
        run: |
          curl -fsSL -o ubo.xpi https://addons.mozilla.org/firefox/downloads/latest/ublock-origin/latest.xpi || {
            URL=$(curl -fsSL https://api.github.com/repos/gorhill/uBlock/releases/latest \
                  | grep -o 'https://[^"]*firefox[^"]*\.xpi' | head -1)
            curl -fsSL -o ubo.xpi "$URL"
          }
          mkdir -p app/src/main/assets/ublock
          unzip -q ubo.xpi -d app/src/main/assets/ublock
          grep -o '"version": *"[^"]*"' app/src/main/assets/ublock/manifest.json | head -1
          test -d app/src/main/assets/ublock/_locales

      - name: Build
        run: gradle --no-daemon assembleRelease -PgeckoVersion="${GECKO_VERSION:-+}"

      - name: Collect APKs
        run: |
          mkdir out
          cp app/build/outputs/apk/release/*arm64-v8a*.apk  out/AdFreeViewer-arm64.apk
          cp app/build/outputs/apk/release/*armeabi-v7a*.apk out/AdFreeViewer-arm32-older-phones.apk
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: out/*.apk

      - name: Publish release (direct APK download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          make_latest: true
          files: out/*.apk
