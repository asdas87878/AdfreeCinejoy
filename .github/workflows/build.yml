name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Find latest stable build tools
        run: |
          G=$(curl -fsSL https://services.gradle.org/versions/current | grep -o '"version" *: *"[^"]*"' | cut -d'"' -f4)
          A=$(curl -fsSL https://dl.google.com/android/maven2/com/android/tools/build/gradle/maven-metadata.xml \
              | grep -o '<version>[0-9]*\.[0-9]*\.[0-9]*</version>' | sed 's/<[^>]*>//g' | sort -V | tail -1)
          echo "Gradle $G, Android Gradle Plugin $A"
          echo "GRADLE_VERSION=$G" >> "$GITHUB_ENV"
          echo "AGP_VERSION=$A" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Find latest GeckoView (Firefox engine)
        run: |
          V=$(curl -fsSL https://maven.mozilla.org/maven2/org/mozilla/geckoview/geckoview/maven-metadata.xml \
              | sed -n 's:.*<release>\(.*\)</release>.*:\1:p' | head -1)
          echo "GeckoView version: $V"
          echo "GECKO_VERSION=$V" >> "$GITHUB_ENV"

      - name: Download latest uBlock Origin
        run: |
          curl -fsSL -o ubo.xpi https://addons.mozilla.org/firefox/downloads/latest/ublock-origin/latest.xpi || {
            URL=$(curl -fsSL https://api.github.com/repos/gorhill/uBlock/releases/latest \
                  | grep -o 'https://[^"]*firefox[^"]*\.xpi' | head -1)
            curl -fsSL -o ubo.xpi "$URL"
          }
          mkdir -p app/src/main/assets/ublock
          unzip -q ubo.xpi -d app/src/main/assets/ublock
          grep -o '"version": *"[^"]*"' app/src/main/assets/ublock/manifest.json | head -1
          test -d app/src/main/assets/ublock/_locales

      - name: Build
        run: |
          set -o pipefail
          gradle --no-daemon assembleRelease -PgeckoVersion="${GECKO_VERSION:-+}" -PagpVersion="$AGP_VERSION" 2>&1 | tee build.log || {
            MSG=$(grep -E -A3 "What went wrong|error:|Could not|requires|incompatible" build.log | head -60 \
                  | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}')
            echo "::error title=Gradle build failed::$MSG"
            exit 1
          }

      - name: Collect APKs
        run: |
          mkdir out
          cp app/build/outputs/apk/release/*arm64-v8a*.apk  out/AdFreeViewer-arm64.apk
          cp app/build/outputs/apk/release/*armeabi-v7a*.apk out/AdFreeViewer-arm32-older-phones.apk
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: out/*.apk

      - name: Publish release (direct APK download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          make_latest: true
          files: out/*.apk
